name: Maintenance task
description: Track refactoring, documentation, dependency, or operational housekeeping work.
title: "chore: "
labels:
  - chore
body:
  - type: markdown
    attributes:
      value: |
        Use this template for repository maintenance, documentation alignment, or low-risk internal improvements.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be improved and why
      placeholder: Rotate planning files and add issue templates for issue-driven development.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, services, or process areas included
      placeholder: AGENTS.md, plans.md, .github/ISSUE_TEMPLATE, docs/github-issue-workflow.md
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Concrete outputs expected from this task
      placeholder: |
        - [ ] Template files added
        - [ ] Documentation updated
        - [ ] Planning notes recorded
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Observable completion conditions
      placeholder: |
        - [ ] Updated process is documented
        - [ ] Repository structure remains consistent
        - [ ] No unrelated code changes are introduced
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands or checks used to confirm the task
      placeholder: |
        - git diff review
        - dotnet build
        - dotnet test
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, docs, or notes
      placeholder: plans/2026-03/..., docs/..., related issue

